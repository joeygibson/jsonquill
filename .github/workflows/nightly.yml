name: Nightly

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/nightly.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-nightly:
    name: Build Nightly
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: jsonquill
            asset_name: jsonquill-linux-x86_64
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: jsonquill
            asset_name: jsonquill-linux-x86_64-musl
            features: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: jsonquill
            asset_name: jsonquill-macos-x86_64
            features: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: jsonquill
            asset_name: jsonquill-macos-aarch64
            features: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: jsonquill.exe
            asset_name: jsonquill-windows-x86_64
            features: "--no-default-features --features backend-crossterm"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: jsonquill.exe
            asset_name: jsonquill-windows-aarch64
            features: "--no-default-features --features backend-crossterm"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Strip binary (Unix only)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.asset_name }}.zip"

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

  publish-nightly:
    name: Publish Nightly
    needs: build-nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            artifacts/**/*.tar.gz \
            artifacts/**/*.zip \
            --title "Nightly Build" \
            --notes "Automated nightly build from \`main\` branch.

          **Commit:** ${{ github.sha }}
          **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          > These builds are generated automatically and may be unstable.
          > For stable releases, see the [latest release](https://github.com/${{ github.repository }}/releases/latest)." \
            --prerelease
