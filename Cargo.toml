[package]
name = "jsonquill"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Joey Gibson"]
description = "JSONQuill - A terminal-based structural JSON editor with vim-style keybindings"
repository = "https://github.com/joeygibson/jsonquill"
readme = "README.md"
keywords = ["json", "editor", "tui", "vim", "terminal"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["termion"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
termion = "4.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
arboard = "3.4"  # for clipboard support
dirs = "5.0"  # for config directory path

[dev-dependencies]
tempfile = "3.13"
