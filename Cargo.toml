[package]
name = "jeditor"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
arboard = "3.4"  # for clipboard support

[dev-dependencies]
tempfile = "3.13"
